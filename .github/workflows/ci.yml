# Continuous integration pipeline of Marginália.
# For now it only builds the software. Add one job for SAST, one for the
# tests and one for DAST.
name: CI

on:
  push:
    branches: ["develop", "feature/**"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build the software and the unit tests
        run: make
  
  SAST:
    name: SAST
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13' 

      - name: Setup Semgrep
        run: |
          pipx install semgrep==1.182.1

      - name: run SAST
        run: |
          make sast
  
  DAST:
    name: DAST
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: run DAST
        run: |
          make dast

